version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: "20"
    commands:
      - useradd -m codegen
      - npm install -g @anthropic-ai/claude-code
      - npm install @aws-sdk/client-bedrock-agent

  pre_build:
    commands:
      # Write an ES module script to the build directory so it can resolve
      # node_modules installed above, then run it to fetch both prompts.
      - |
        cat > fetch-prompts.mjs << 'JSEOF'
        import { BedrockAgentClient, GetPromptCommand } from '@aws-sdk/client-bedrock-agent';
        import { writeFileSync } from 'fs';
        const client = new BedrockAgentClient({ region: process.env.AWS_REGION });
        const [sys, task] = await Promise.all([
          client.send(new GetPromptCommand({ promptIdentifier: process.env.SYSTEM_PROMPT_ARN })),
          client.send(new GetPromptCommand({ promptIdentifier: process.env.TASK_PROMPT_ARN })),
        ]);
        writeFileSync('/tmp/system_prompt.txt', sys.variants[0].templateConfiguration.text.text);
        writeFileSync('/tmp/task_prompt.txt', task.variants[0].templateConfiguration.text.text);
        console.log('prompts fetched');
        JSEOF
      - node fetch-prompts.mjs

  build:
    commands:
      # Run as non-root so --dangerously-skip-permissions is permitted.
      # -E preserves CodeBuild environment variables (credentials, ANTHROPIC_MODEL, etc.)
      # -H sets HOME to /home/codegen so Claude Code config is isolated per build.
      # Model is controlled by ANTHROPIC_MODEL (overridable per build invocation).
      # Changing the model also requires updating the IAM policy in
      # hephaestus-stack.ts (BedrockInvokeHaikuOnly) to allow the new model ARN.
      - sudo -E -H -u codegen claude -p "$(cat /tmp/task_prompt.txt)"
          --model "$ANTHROPIC_MODEL"
          --append-system-prompt-file /tmp/system_prompt.txt
          --dangerously-skip-permissions
          --max-turns 30
          --no-session-persistence
